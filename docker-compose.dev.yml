services:
  mongo:
    ports:
      - "27018:27017"

  backend:
    image: chat-app-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGO_AUTO_INDEX: "true"
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
    volumes:
      - ./backend:/app
