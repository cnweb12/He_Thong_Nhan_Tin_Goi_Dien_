services:
  mongo:
    ports:
      - "27018:27017"

  backend:
    image: chat-app-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGO_AUTO_INDEX: "true"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
