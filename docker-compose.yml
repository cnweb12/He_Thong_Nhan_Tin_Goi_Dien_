services:
  mongo:
    image: mongo:8.0
    container_name: chat-app-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DB:-chat_app}
      MONGO_APP_DB: ${MONGO_APP_DB:-chat_app}
      MONGO_APP_USER: ${MONGO_APP_USER:-chat_app_user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-chat_app_password}
    volumes:
      - mongo_data:/data/db
      - ./backend/database/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: chat-app-backend
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: ${PORT:-3000}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:-chat_app}
      MONGO_APP_USER: ${MONGO_APP_USER:-chat_app_user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-chat_app_password}
      MONGO_AUTH_SOURCE: ${MONGO_APP_DB:-chat_app}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: chat-app-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mongo_data:
